name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Cython
        run: |
          brew install autoconf automake libtool pkg-config
          pip install "cython<3.0.0" kivy-ios requests urllib3 chardet certifi idna

      - name: Build Kivy Recipe
        run: |
          toolchain build python3 kivy

      - name: Create Xcode Project
        run: |
          toolchain create braviaremote .

      - name: Configure Network Permissions
        run: |
          PLIST_PATH=$(find braviaremote-ios -name "*-Info.plist" | head -n 1)
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'BRAVIAテレビを操作するためにローカルネットワークを使用します。'" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST_PATH" || true
          fi

      - name: Disable Problematic Run Script & Fix Project Settings
        run: |
          PROJ_PATH=$(find braviaremote-ios -name "*.xcodeproj" | head -n 1)
          PBXPROJ="$PROJ_PATH/project.pbxproj"
          
          # 1. コードサイン・プロファイル設定の無効化
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = "";//g' "$PBXPROJ"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "";//g' "$PBXPROJ"
          
          # 2. 落ちる原因となっている Run Script フェーズ（Script-113D17...）の実行をパス（exit 0）に書き換え
          python3 -c "
          with open('$PBXPROJ', 'r') as f:
              content = f.read()
          
          # shellScript の実行内容を常に成功するように安全化
          import re
          content = re.sub(r'shellScript = \".*?\";', 'shellScript = \"exit 0;\";', content, flags=re.DOTALL)
          
          with open('$PBXPROJ', 'w') as f:
              f.write(content)
          "

      - name: Build App Package (Device Target)
        run: |
          PROJ_PATH=$(find braviaremote-ios -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_PATH" | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
          
          xcodebuild -project "$PROJ_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_REQUIRED=NO

      - name: Inject Python App Source into App Bundle
        run: |
          APP_PATH=$(find braviaremote-ios/build -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find braviaremote-ios -name "*.app" | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            mkdir -p "$APP_PATH/YourApp"
            cp main.py "$APP_PATH/YourApp/"
          fi

      - name: Package IPA Payload
        run: |
          mkdir -p Payload
          APP_PATH=$(find braviaremote-ios/build -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find braviaremote-ios -name "*.app" | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/
            zip -r braviaremote.ipa Payload
            mkdir -p output
            mv braviaremote.ipa output/
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BraviaRemote-iOS-IPA
          path: output/
