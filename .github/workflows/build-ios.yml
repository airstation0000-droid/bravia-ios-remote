name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Cython
        run: |
          brew install autoconf automake libtool pkg-config
          pip install "cython<3.0.0" kivy-ios requests urllib3 chardet certifi idna

      - name: Build Kivy Recipe
        run: |
          toolchain build python3 kivy

      - name: Create Xcode Project
        run: |
          toolchain create braviaremote main.py

      - name: Configure Network Permissions
        run: |
          PLIST_PATH=$(find braviaremote-ios -name "*-Info.plist" | head -n 1)
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'BRAVIAテレビを操作するためにローカルネットワークを使用します。'" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST_PATH" || true
          fi

      - name: Generate Dummy Provisioning Profile & Self-Signed Cert
        run: |
          KEYCHAIN_PATH=$HOME/Library/Keychains/build.keychain-db
          security create-keychain -p "buildpass" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "buildpass" $KEYCHAIN_PATH
          
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout selfsigned.key -out selfsigned.crt \
            -subj "/CN=iOS Development/O=BraviaRemote/C=JP"
          
          openssl pkcs12 -export -out selfsigned.p12 \
            -inkey selfsigned.key -in selfsigned.crt \
            -passout pass:buildpass -legacy || \
          openssl pkcs12 -export -out selfsigned.p12 \
            -inkey selfsigned.key -in selfsigned.crt \
            -passout pass:buildpass
          
          security import selfsigned.p12 -k $KEYCHAIN_PATH -P "buildpass" -A
          security set-key-partition-list -S apple-tool-,apple:,codesign: -s -k "buildpass" $KEYCHAIN_PATH

          # Provisioning Profileエラー回避のためXcodeプロジェクト設定をAd-Hoc / CodeSign無効化に強制書き換え
          PROJ_PATH=$(find braviaremote-ios -name "*.xcodeproj" | head -n 1)
          PBXPROJ="$PROJ_PATH/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = "";//g' "$PBXPROJ"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "";//g' "$PBXPROJ"

      - name: Build App Package (Device / Bypassed Profile)
        run: |
          PROJ_PATH=$(find braviaremote-ios -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_PATH" | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
          
          xcodebuild -project "$PROJ_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_REQUIRED=NO

      - name: Package IPA Payload
        run: |
          mkdir -p Payload
          APP_PATH=$(find braviaremote-ios/build -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find braviaremote-ios -name "*.app" | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/
            zip -r braviaremote.ipa Payload
            mkdir -p output
            mv braviaremote.ipa output/
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BraviaRemote-iOS-IPA
          path: output/
