name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Cython
        run: |
          brew install autoconf automake libtool pkg-config
          pip install "cython<3.0.0" kivy-ios requests urllib3 chardet certifi idna

      - name: Build Kivy Recipe
        run: |
          toolchain build python3 kivy

      - name: Create Xcode Project
        run: |
          toolchain create BraviaRemote main.py
          pip install --target=BraviaRemote-ios/YourApp/YourApp/site-packages requests urllib3 chardet certifi idna || true

      - name: Configure Network Permissions
        run: |
          PLIST_PATH="BraviaRemote-ios/BraviaRemote-Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'BRAVIAテレビを操作するためにローカルネットワークを使用します。'" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST_PATH" || true
          fi

      - name: Build App Package
        run: |
          xcodebuild -project BraviaRemote-ios/BraviaRemote.xcodeproj \
            -scheme BraviaRemote \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BraviaRemote-iOS-App
          path: BraviaRemote-ios/build/Release-iphonesimulator/
